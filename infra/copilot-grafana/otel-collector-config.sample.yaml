receivers:
  otlp:
    protocols:
      http:
        # Docker publishes this receiver to localhost only in the README example.
        # If you run the collector directly on your workstation, prefer 127.0.0.1.
        endpoint: 0.0.0.0:4318
      grpc:
        # Keep 0.0.0.0 for container use; restrict host exposure with Docker port binding.
        endpoint: 0.0.0.0:4317

exporters:
  azuremonitor:
    connection_string: "InstrumentationKey=<YOUR-KEY>;IngestionEndpoint=https://<region>.in.applicationinsights.azure.com/;LiveEndpoint=https://<region>.livediagnostics.monitor.azure.com/;ApplicationId=<YOUR-APP-ID>"

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [azuremonitor]
    metrics:
      receivers: [otlp]
      exporters: [azuremonitor]
    logs:
      receivers: [otlp]
      exporters: [azuremonitor]