version: 2
updates:
  - package-ecosystem: dotnet-sdk
    directory: "/"
    schedule:
      interval: daily
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: daily
    groups:
      dependencies:
        patterns:
          - "*"
  - package-ecosystem: nuget
    directory: "/.config"
    schedule:
      interval: daily
    groups:
      dotnet-tools:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: "/tools/apm"
    schedule:
      interval: daily
    ignore:
      - dependency-name: apm-cli
        versions:
          - "0.35.0"
  - package-ecosystem: gomod
    directory: "/tools/ghalint"
    schedule:
      interval: daily
