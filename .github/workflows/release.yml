name: Release

on:
  workflow_dispatch:
    inputs:
      channelSuffix:
        description: Velopack channel suffix appended to each runtime.
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
          - preview
      draft:
        description: Leave the validated GitHub Release as a draft instead of publishing it.
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark the GitHub Release as a prerelease.
        required: true
        default: false
        type: boolean
permissions:
  contents: write

defaults:
  run:
    shell: pwsh

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      channel-suffix: ${{ steps.meta.outputs.channel_suffix }}
      draft: ${{ steps.meta.outputs.draft }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_CHANNEL_SUFFIX: ${{ inputs.channelSuffix }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          [xml]$buildProps = Get-Content Directory.Build.props
          $version = $buildProps.Project.PropertyGroup |
              ForEach-Object { $_.RepoSyncRadarVersion.InnerText } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($version)) {
              throw 'Directory.Build.props must define RepoSyncRadarVersion for release builds.'
          }

          if ($version -notmatch '^\d+\.\d+\.\d+([\-+][0-9A-Za-z\-.+]+)?$') {
              throw "RepoSyncRadarVersion '$version' must be SemVer like 0.1.0 or 0.1.0-beta.1."
          }

          $channelSuffix = $env:INPUT_CHANNEL_SUFFIX
          if ([string]::IsNullOrWhiteSpace($channelSuffix)) {
              $channelSuffix = 'stable'
          }

          $draft = if ([string]::IsNullOrWhiteSpace($env:INPUT_DRAFT)) { 'true' } else { $env:INPUT_DRAFT.ToLowerInvariant() }
          $prerelease = if ([string]::IsNullOrWhiteSpace($env:INPUT_PRERELEASE)) { ($version.Contains('-')).ToString().ToLowerInvariant() } else { $env:INPUT_PRERELEASE.ToLowerInvariant() }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "channel_suffix=$channelSuffix" >> $env:GITHUB_OUTPUT
          "draft=$draft" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

  release-preflight:
    name: Check release immutability preconditions
    needs:
      - prepare
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Require a new release or empty draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
        run: |
          $endpoint = "repos/$env:REPOSITORY/releases/tags/$env:TAG"
          $releaseJson = gh api $endpoint --jq '{isDraft: .draft, assetNames: [.assets[].name]}' 2>&1
          if ($LASTEXITCODE -ne 0) {
              $errorMessage = ($releaseJson | Out-String).Trim()
              if ($errorMessage -match '\(HTTP 404\)') {
                  Write-Host "No existing GitHub Release found for $env:TAG."
                  exit 0
              }

              Write-Output "::error title=Unable to inspect GitHub Release::Failed to check '$env:TAG' before building. Verify the workflow token and GitHub API availability."
              Write-Host "GitHub CLI reported: $errorMessage"
              exit 1
          }

          $release = $releaseJson | ConvertFrom-Json
          $assetCount = @($release.assetNames).Count

          if (-not $release.isDraft) {
              Write-Output "::error title=Release tag is already published::GitHub Release '$env:TAG' is already published. Increment RepoSyncRadarVersion and run the workflow with a new tag; published assets are immutable."
              exit 1
          }

          if ($assetCount -gt 0) {
              if ($env:DRAFT -ne 'true') {
                  Write-Host "Found draft GitHub Release '$env:TAG' with $assetCount asset(s); the publish job will validate and publish it without replacing assets."
                  exit 0
              }

              Write-Output "::error title=Draft release already contains immutable assets::GitHub Release '$env:TAG' is a draft with $assetCount asset(s). To publish those existing assets, rerun with draft=false. To build corrected assets, increment RepoSyncRadarVersion and use a new tag."
              exit 1
          }

          Write-Host "Found an empty draft GitHub Release for $env:TAG; it can be reused."

  build-test:
    name: Build and test
    needs:
      - prepare
      - release-preflight
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore RepoSyncRadar.sln

      - name: Build
        run: dotnet build RepoSyncRadar.sln --no-restore -warnaserror

      - name: Test
        run: dotnet test RepoSyncRadar.sln --no-build --timeout 10m -- --filter-not-trait Category=Manual --output detailed

      - name: Upload test result logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: tests/**/TestResults/**
          if-no-files-found: warn
          retention-days: 7

  package:
    name: Package ${{ matrix.runtime }}
    needs:
      - prepare
      - build-test
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - win-x64
          - win-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build Velopack release
        run: |
          $channel = '${{ matrix.runtime }}-${{ needs.prepare.outputs.channel-suffix }}'
          $packageArgs = @{
              Version = '${{ needs.prepare.outputs.version }}'
              Runtime = '${{ matrix.runtime }}'
              Channel = $channel
              Force = $true
              NoPortable = $true
              NoLegacyManifest = $true
          }

          ./scripts/Build-VelopackRelease.ps1 @packageArgs

      - name: Smoke test installed package
        if: ${{ matrix.runtime == 'win-x64' }}
        run: ./scripts/Test-VelopackInstalledE2E.ps1 -Runtime '${{ matrix.runtime }}' -CleanInstallRoot

      - name: Upload installed-package test result logs
        if: ${{ matrix.runtime == 'win-x64' && failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-package-test-results-${{ matrix.runtime }}
          path: tests/**/TestResults/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velopack-${{ matrix.runtime }}
          path: artifacts/release/velopack/${{ matrix.runtime }}/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare
      - package
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: velopack-*
          path: dist/release-assets
          merge-multiple: true

      - name: Create draft release and upload immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          CHANNEL_SUFFIX: ${{ needs.prepare.outputs.channel-suffix }}
        run: |
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @"
          RepoSyncRadar $env:VERSION

          Windows installers and Velopack update packages are attached for x64 and Arm64.
          "@ | Set-Content -Path $notesPath -Encoding utf8NoBOM

          $assets = Get-ChildItem dist/release-assets -File | Sort-Object Name
          if ($assets.Count -eq 0) {
              throw 'No release assets were downloaded.'
          }

          foreach ($runtime in @('win-x64', 'win-arm64')) {
              $channel = "$runtime-$env:CHANNEL_SUFFIX"
              $requiredPatterns = @(
                  "SIkebe.RepoSyncRadar-$channel-Setup.exe",
                  "SIkebe.RepoSyncRadar-*-$channel-full.nupkg",
                  "releases.$channel.json",
                  "assets.$channel.json"
              )

              foreach ($pattern in $requiredPatterns) {
                  if (-not ($assets | Where-Object { $_.Name -like $pattern })) {
                      throw "Missing required Velopack release asset matching '$pattern'."
                  }
              }
          }

          $releaseArgs = @('release', 'create', $env:TAG, '--repo', $env:REPOSITORY, '--target', '${{ github.sha }}', '--title', "RepoSyncRadar $env:VERSION", '--notes-file', $notesPath, '--draft')
          if ($env:PRERELEASE -eq 'true') {
              $releaseArgs += '--prerelease'
          }

          $releaseJson = gh release view $env:TAG --repo $env:REPOSITORY --json isDraft,assets 2>$null
          if ($LASTEXITCODE -ne 0) {
              gh @releaseArgs
          }
          else {
              $release = $releaseJson | ConvertFrom-Json
              $assetCount = @($release.assets).Count

              if (-not $release.isDraft) {
                  throw "GitHub Release '$env:TAG' was published before asset upload. Use a new RepoSyncRadarVersion/tag for corrected assets."
              }

                if ($assetCount -gt 0) {
                  if ($env:DRAFT -eq 'true') {
                    throw "Draft GitHub Release '$env:TAG' already has $assetCount asset(s). Delete the draft before rerunning, or use a new RepoSyncRadarVersion/tag for corrected assets."
                  }

                  $expectedAssetNames = @($assets | ForEach-Object { $_.Name } | Sort-Object)
                  $releaseAssetNames = @($release.assets | ForEach-Object { $_.name } | Sort-Object)

                  $missingAssetNames = @($expectedAssetNames | Where-Object { $releaseAssetNames -notcontains $_ })
                  if ($missingAssetNames.Count -gt 0) {
                    throw "Draft GitHub Release '$env:TAG' is missing expected asset(s): $($missingAssetNames -join ', '). Delete the draft before rerunning, or upload a complete new version/tag."
                  }

                  $unexpectedAssetNames = @($releaseAssetNames | Where-Object { $expectedAssetNames -notcontains $_ })
                  if ($unexpectedAssetNames.Count -gt 0) {
                    throw "Draft GitHub Release '$env:TAG' has unexpected asset(s): $($unexpectedAssetNames -join ', '). Delete the draft before rerunning, or upload a complete new version/tag."
                  }

                  Write-Host "Existing draft assets match the expected Velopack asset names; publishing without re-uploading assets."

                  $publishArgs = @('release', 'edit', $env:TAG, '--repo', $env:REPOSITORY, '--draft=false', "--prerelease=$env:PRERELEASE")
                  gh @publishArgs
                  exit 0
              }

              $editArgs = @('release', 'edit', $env:TAG, '--repo', $env:REPOSITORY, '--target', '${{ github.sha }}', '--title', "RepoSyncRadar $env:VERSION", '--notes-file', $notesPath, '--draft=true', "--prerelease=$env:PRERELEASE")
              gh @editArgs
          }

          $uploadArgs = @('release', 'upload', $env:TAG, '--repo', $env:REPOSITORY) + @($assets.FullName)
          gh @uploadArgs

          if ($env:DRAFT -ne 'true') {
              $publishArgs = @('release', 'edit', $env:TAG, '--repo', $env:REPOSITORY, '--draft=false', "--prerelease=$env:PRERELEASE")
              gh @publishArgs
          }
