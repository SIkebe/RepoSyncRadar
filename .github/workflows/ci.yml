name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  ghalint:
    name: ghalint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install ghalint
        run: |
          $goModPath = 'tools/ghalint/go.mod'
          $versionLine = Get-Content $goModPath | Where-Object { $_ -match 'github\.com/suzuki-shunsuke/ghalint\s+v\d+\.\d+\.\d+' } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($versionLine)) {
            throw "Unable to resolve ghalint version from $goModPath."
          }

          $version = [regex]::Match($versionLine, 'github\.com/suzuki-shunsuke/ghalint\s+(v\d+\.\d+\.\d+(?:[-+][^\s]+)?)').Groups[1].Value
          go install "github.com/suzuki-shunsuke/ghalint/cmd/ghalint@$version"
          Join-Path (go env GOPATH) 'bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run ghalint
        run: ghalint run

  build-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        id: nuget-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        env:
          NUGET_CACHE_HIT: ${{ steps.nuget-cache.outputs.cache-hit }}
        run: |
          $elapsed = Measure-Command { dotnet restore RepoSyncRadar.sln }
          $seconds = [Math]::Round($elapsed.TotalSeconds, 2)
          $cacheSize = Get-ChildItem "$HOME\.nuget\packages" -Recurse -File -ErrorAction SilentlyContinue |
            Measure-Object -Property Length -Sum
          $cacheMiB = [Math]::Round(($cacheSize.Sum ?? 0) / 1MB, 2)
          Write-Host "MEASUREMENT kind=nuget-restore cache_hit=$env:NUGET_CACHE_HIT seconds=$seconds cache_mib=$cacheMiB"

          @"
          ### NuGet restore measurement

          | Metric | Value |
          | --- | --- |
          | Cache hit | $env:NUGET_CACHE_HIT |
          | Restore seconds | $seconds |
          | NuGet cache size MiB | $cacheMiB |
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Build
        run: dotnet build RepoSyncRadar.sln --no-restore -warnaserror

      - name: Test
        run: dotnet test RepoSyncRadar.sln --no-build -- --filter-not-trait Category=Manual --output detailed

      - name: Upload test result logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: tests/**/TestResults/**
          if-no-files-found: warn
          retention-days: 7


  installed-package-e2e:
    name: Installed package E2E
    runs-on: windows-latest
    needs: build-test
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        id: nuget-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build win-x64 Velopack package
        env:
          NUGET_CACHE_HIT: ${{ steps.nuget-cache.outputs.cache-hit }}
        run: |
          $elapsed = Measure-Command {
            ./scripts/Build-VelopackRelease.ps1 `
              -Runtime win-x64 `
              -Channel win-x64-ci `
              -OutputRoot artifacts/ci-release `
              -Force `
              -NoPortable `
              -NoLegacyManifest
          }
          $seconds = [Math]::Round($elapsed.TotalSeconds, 2)
          $cacheSize = Get-ChildItem "$HOME\.nuget\packages" -Recurse -File -ErrorAction SilentlyContinue |
            Measure-Object -Property Length -Sum
          $cacheMiB = [Math]::Round(($cacheSize.Sum ?? 0) / 1MB, 2)
          Write-Host "MEASUREMENT kind=velopack-package runtime=win-x64 cache_hit=$env:NUGET_CACHE_HIT seconds=$seconds cache_mib=$cacheMiB"

          @"
          ### Velopack package measurement

          | Metric | Value |
          | --- | --- |
          | NuGet cache hit | $env:NUGET_CACHE_HIT |
          | Package seconds | $seconds |
          | NuGet cache size MiB | $cacheMiB |
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Smoke test installed package
        run: ./scripts/Test-VelopackInstalledE2E.ps1 -Runtime win-x64 -ReleaseDir artifacts/ci-release/velopack/win-x64 -CleanInstallRoot

      - name: Upload installed-package test result logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-package-test-results
          path: tests/**/TestResults/**
          if-no-files-found: warn
          retention-days: 7